allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

// Flutter's integration_test plugin declares these as dynamic versions (for
// example `1.2+`). Pin them so ordinary APK builds do not need Maven metadata
// just because integration tests are available as a dev dependency.
subprojects {
    configurations.configureEach {
        resolutionStrategy.force(
            'androidx.test:runner:1.3.0',
            'androidx.test:rules:1.2.0',
            'androidx.test.espresso:espresso-core:3.3.0',
        )
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
